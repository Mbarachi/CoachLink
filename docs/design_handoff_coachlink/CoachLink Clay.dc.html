document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Sign up<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.forgot }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Forgot<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.otp }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">OTP<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.resetSuccess }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Reset success<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.role }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Role select<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.athleteOnboard }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Athlete onboarding<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.roleCoach }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Coach onboarding<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"font-family:monospace;font-size:10.5px;letter-spacing:.1em;color:#a08e76;margin:16px 0 9px;\">ATHLETE &amp; PARENT<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:7px;\">\n        <button sc-camel-on-click=\"{{ nav.home }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Home<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.search }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Search<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.listing }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Coach listing<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.coach }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Coach details<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.booking }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Booking<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.payment }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Payment<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.success }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Success<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.bookings }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">My bookings<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.notifications }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Notifications<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.profile }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Profile<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.settings }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Settings<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"font-family:monospace;font-size:10.5px;letter-spacing:.1em;color:#a08e76;margin:16px 0 9px;\">COACH<\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:7px;\">\n        <button sc-camel-on-click=\"{{ nav.cdash }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Dashboard<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.crequests }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Incoming requests<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.crequest }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Request details<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.cavailability }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Availability<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.cprofile }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Profile mgmt<\u002Fbutton>\n        <button sc-camel-on-click=\"{{ nav.cearnings }}\" style=\"border:1px solid #ECDFCD;background:#F0E5D5;border-radius:9px;padding:7px 11px;font-family:'Plus Jakarta Sans',sans-serif;font-size:12.5px;font-weight:600;color:#241C13;cursor:pointer;\">Earnings<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Faside>\n\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { route: 'splash', stack: [], role: 'athlete', coach: 0, req: 0, paid: false, hero: 0, otpContext: 'signup', coachStep: 0 };\n\n  componentDidMount() {\n    this._heroTimer = setInterval(() => this.setState(s => ({ hero: (s.hero + 1) % 2 })), 4200);\n  }\n  componentWillUnmount() {\n    clearInterval(this._heroTimer);\n  }\n\n  renderVals() {\n    const coaches = [\n      { name: 'Tobi Adebayo',    sport: 'Swimming', venue: 'Festival Hotel Pool', price: '₦12,000', rating: '4.8', reviews: 32, dist: '1.2km', exp: '5 yrs', sessions: '286', initials: 'TA' },\n      { name: 'Chidinma Okafor', sport: 'Tennis',   venue: 'MU Court',            price: '₦15,000', rating: '4.9', reviews: 27, dist: '2.1km', exp: '7 yrs', sessions: '340', initials: 'CO' },\n      { name: 'Emeka Johnson',   sport: 'Swimming', venue: 'Golden Tulip Pool',   price: '₦9,000',  rating: '4.7', reviews: 18, dist: '3.0km', exp: '4 yrs', sessions: '150', initials: 'EJ' },\n      { name: 'Sarah Danjuma',   sport: 'Tennis',   venue: 'MU Court',            price: '₦18,000', rating: '4.6', reviews: 14, dist: '2.4km', exp: '6 yrs', sessions: '210', initials: 'SD' },\n      { name: 'Yusuf Bello',     sport: 'Swimming', venue: 'School Facilities',   price: '₦7,500',  rating: '4.5', reviews: 21, dist: '4.1km', exp: '3 yrs', sessions: '98',  initials: 'YB' },\n    ];\n\n    const myBookings = [\n      { coach: 'Tobi Adebayo',    initials: 'TA', sport: 'Swimming', date: 'Wed, 15 May', time: '8:00 AM', venue: 'Festival Hotel Pool', status: 'Pending',   price: '₦12,000' },\n      { coach: 'Chidinma Okafor', initials: 'CO', sport: 'Tennis',   date: 'Fri, 17 May', time: '5:00 PM', venue: 'MU Court',            status: 'Confirmed', price: '₦15,000' },\n      { coach: 'Emeka Johnson',   initials: 'EJ', sport: 'Swimming', date: 'Sat, 18 May', time: '7:00 AM', venue: 'Golden Tulip Pool',   status: 'Completed', price: '₦9,000' },\n    ];\n\n    const notifications = [\n      { title: 'Request accepted',  body: 'Tobi Adebayo accepted your session request. Complete payment to confirm.', time: '2m', unread: true },\n      { title: 'Payment confirmed', body: 'Your booking with Chidinma Okafor is confirmed for Fri, 17 May.',           time: '1h', unread: true },\n      { title: 'Leave a review',    body: 'How was your session with Emeka Johnson? Share your feedback.',             time: '1d', unread: false },\n      { title: 'Session reminder',  body: 'Your swimming session is tomorrow at 8:00 AM, Festival Hotel Pool.',        time: '2d', unread: false },\n    ];\n\n    const requests = [\n      { name: 'John Doe',   initials: 'JD', sport: 'Swimming', date: 'Wed, 15 May', time: '8:00 AM', venue: 'Festival Hotel Pool', note: 'Beginner — would like to learn freestyle and build confidence in deep water.', price: '₦12,000', child: '' },\n      { name: 'Amara Eze',  initials: 'AE', sport: 'Swimming', date: 'Thu, 16 May', time: '4:00 PM', venue: 'Festival Hotel Pool', note: 'Booking for my daughter. She is a complete beginner.', price: '₦12,000', child: 'Zara, age 9' },\n      { name: 'Bola Smith', initials: 'BS', sport: 'Swimming', date: 'Sat, 18 May', time: '7:00 AM', venue: 'Festival Hotel Pool', note: 'Intermediate — focus on endurance and lap times.', price: '₦12,000', child: '' },\n    ];\n\n    const earningsTx = [\n      { name: 'Chidinma — Tennis', date: 'Fri, 17 May', amount: '+₦15,000' },\n      { name: 'John Doe — Swimming', date: 'Wed, 15 May', amount: '+₦12,000' },\n      { name: 'Bola Smith — Swimming', date: 'Sat, 11 May', amount: '+₦12,000' },\n      { name: 'Payout to GTBank ••• 4021', date: 'Mon, 6 May', amount: '−₦180,000' },\n    ];\n\n    const coachRoutes = ['coachOnboard', 'cdash', 'crequests', 'crequest', 'cavailability', 'cprofile', 'cearnings'];\n    const athleteRoutes = ['athleteOnboard', 'home', 'search', 'listing', 'coach', 'booking', 'payment', 'success', 'bookings', 'notifications', 'profile', 'settings'];\n\n    const go = (route) => this.setState(s => ({\n      route,\n      stack: [...s.stack, s.route],\n      role: coachRoutes.includes(route) ? 'coach'\n          : (athleteRoutes.includes(route) && s.role === 'coach') ? 'athlete'\n          : s.role,\n    }));\n    const back = () => this.setState(s => {\n      const st = [...s.stack];\n      const prev = st.pop() || 'home';\n      return { route: prev, stack: st };\n    });\n    const openCoach = (i) => this.setState(s => ({ coach: i, route: 'coach', stack: [...s.stack, s.route], role: s.role === 'coach' ? 'athlete' : s.role }));\n    const openReq = (i) => this.setState(s => ({ req: i, route: 'crequest', stack: [...s.stack, s.route], role: 'coach' }));\n\n    const routeNames = ['splash','welcome','signin','signup','forgot','otp','resetSuccess','role', ...athleteRoutes, ...coachRoutes];\n    const nav = {};\n    routeNames.forEach(rt => { nav[rt] = () => go(rt); });\n    nav.roleAthlete = () => this.setState(s => ({ role: 'athlete', route: 'athleteOnboard', stack: [...s.stack, s.route] }));\n    nav.roleParent  = () => this.setState(s => ({ role: 'parent',  route: 'athleteOnboard', stack: [...s.stack, s.route] }));\n    nav.roleCoach   = () => this.setState(s => ({ role: 'coach',   route: 'coachOnboard', coachStep: 0, stack: [...s.stack, s.route] }));\n    nav.coachStepNext = () => this.setState(s => ({ coachStep: Math.min(s.coachStep + 1, 3) }));\n    nav.coachStepBack = () => this.setState(s => s.coachStep === 0 ? { route: 'role', stack: [...s.stack, s.route] } : { coachStep: s.coachStep - 1 });\n    nav.coachFinish   = () => this.setState(s => ({ route: 'cdash', stack: [...s.stack, s.route] }));\n    nav.signupOtp   = () => this.setState(s => ({ otpContext: 'signup', route: 'otp', stack: [...s.stack, s.route] }));\n    nav.forgotOtp   = () => this.setState(s => ({ otpContext: 'reset',  route: 'otp', stack: [...s.stack, s.route] }));\n    nav.otpVerify   = () => this.setState(s => ({ route: s.otpContext === 'reset' ? 'resetSuccess' : 'role', stack: [...s.stack, s.route] }));\n    nav.sendRequest = () => this.setState(s => ({ paid: false, route: 'success', stack: [...s.stack, s.route] }));\n    nav.payNow      = () => this.setState(s => ({ paid: true,  route: 'success', stack: [...s.stack, s.route] }));\n\n    const labels = {\n      splash:'Splash', welcome:'Welcome', signin:'Sign in', signup:'Sign up', forgot:'Forgot password', otp:'OTP verification', resetSuccess:'Password reset', role:'Role selection',\n      home:'Home', search:'Search coaches', listing:'Coach listing', coach:'Coach details', booking:'Booking request', payment:'Payment', success:'Booking success',\n      bookings:'My bookings', notifications:'Notifications', profile:'Profile', settings:'Settings',\n      cdash:'Coach · Dashboard', crequests:'Coach · Incoming requests', crequest:'Coach · Request details', cavailability:'Coach · Availability', cprofile:'Coach · Profile', cearnings:'Coach · Earnings',\n      athleteOnboard:'Complete profile (Athlete/Parent)', coachOnboard:'Complete profile (Coach)',\n    };\n\n    const r = this.state.route;\n    const is = {};\n    routeNames.forEach(rt => { is[rt] = r === rt; });\n\n    return {\n      is, nav, back,\n      routeLabel: labels[r] || r,\n      role: this.state.role,\n      isParent: this.state.role === 'parent',\n      roleLabel: this.state.role === 'parent' ? 'Parent' : 'Athlete',\n      isResetOtp: this.state.otpContext === 'reset',\n      coachStep: this.state.coachStep,\n      isCoachStep0: this.state.coachStep === 0,\n      isCoachStep1: this.state.coachStep === 1,\n      isCoachStep2: this.state.coachStep === 2,\n      isCoachStep3: this.state.coachStep === 3,\n      coachStepLabel: ['Sport & experience','Venue & pricing','Availability','Verification & review'][this.state.coachStep],\n      coachStepNum: this.state.coachStep + 1,\n      dotCoach0: this.state.coachStep >= 0 ? '#E1623C' : '#ECDFCD',\n      dotCoach1: this.state.coachStep >= 1 ? '#E1623C' : '#ECDFCD',\n      dotCoach2: this.state.coachStep >= 2 ? '#E1623C' : '#ECDFCD',\n      dotCoach3: this.state.coachStep >= 3 ? '#E1623C' : '#ECDFCD',\n      heroTransform: `translateX(-${this.state.hero * 100}%)`,\n      dot0Bg: this.state.hero === 0 ? '#241C13' : '#c2b09a',\n      dot1Bg: this.state.hero === 1 ? '#241C13' : '#c2b09a',\n      dot0W: this.state.hero === 0 ? '20px' : '7px',\n      dot1W: this.state.hero === 1 ? '20px' : '7px',\n      setHero0: () => this.setState({ hero: 0 }),\n      setHero1: () => this.setState({ hero: 1 }),\n      paid: this.state.paid,\n      notPaid: !this.state.paid,\n      coach: coaches[this.state.coach],\n      coaches: coaches.map((co, i) => ({ ...co, open: () => openCoach(i) })),\n      myBookings,\n      notifications,\n      requests: requests.map((rq, i) => ({ ...rq, open: () => openReq(i) })),\n      request: requests[this.state.req],\n      earningsTx,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
